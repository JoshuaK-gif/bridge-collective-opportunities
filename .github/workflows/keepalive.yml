name: Keep DB awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -o /dev/null -w "health: %{http_code} in %{time_total}s\n" \
            https://www.bridgecollectiveopport.org/api/health || exit 1